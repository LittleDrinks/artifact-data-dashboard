services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: artifact-data-dashboard-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - backend-data:/app/data
      - hf-cache:/app/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: artifact-data-dashboard-frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  neo4j-data:
  backend-data:
  hf-cache:
