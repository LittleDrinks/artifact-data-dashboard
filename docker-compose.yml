services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # 使用开发环境的Dockerfile
    container_name: artifact-dashboard-frontend
    ports:
      - "8080:3000"
    depends_on:
      - backend
    networks:
      - artifact-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=8080
      - REACT_APP_WDS_SOCKET_HOST=0.0.0.0
      - REACT_APP_WDS_SOCKET_PORT=8080
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
  
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: artifact-dashboard-backend
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js调试端口
    command: node --inspect=0.0.0.0:9229 src/index.js
    env_file:
      - ./.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - NODE_ENV=${NODE_ENV:-development}
      - ATTACHMENT_IMPORT_DIR_WHITELIST=/data/import/crawler
      - ATTACHMENT_UPLOAD_CONCURRENCY=${ATTACHMENT_UPLOAD_CONCURRENCY:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - neo4j
      - redis
    networks:
      - artifact-network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
      - ./backend/__tests__:/app/__tests__
      - ./backend/package.json:/app/package.json
      - ./backend/logs:/app/logs
      - ./backend/scripts:/app/scripts
      - ./backend/config:/app/config
      - uploads-data:/app/uploads
      - ./data:/data/import

  # 本地大模型（Ollama）
  ollama:
    image: ollama/ollama@sha256:2c9595c555fd70a28363489ac03bd5bf9e7c5bdf2890373c3a830ffd7252ce6d
    container_name: artifact-dashboard-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "if [ ! -d /root/.ollama/models/deepseek-r1 ] ; then ollama pull deepseek-r1:8b ; fi ; ollama serve"]
    networks:
      - artifact-network
    restart: unless-stopped

  # Neo4j Cypher MCP（用于工具调用）
  neo4j-cypher:
    image: mcp/neo4j-cypher@sha256:9815579d840262433140dd922158b49ad6d622aabbf7a52bc81f43b9279cdd6c
    container_name: artifact-dashboard-neo4j-cypher
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_TRANSPORT=sse
      - NEO4J_MCP_SERVER_PORT=8080
    ports:
      - "18081:8080"
    networks:
      - artifact-network
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8
    container_name: artifact-dashboard-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: artifact_dashboard
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - artifact-network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Neo4j图数据库
  neo4j:
    image: neo4j:4.4
    container_name: artifact-dashboard-neo4j
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - artifact-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7.2-alpine
    container_name: artifact-dashboard-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - artifact-network
    restart: unless-stopped

networks:
  artifact-network:
    driver: bridge

volumes:
  mysql-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  uploads-data:
  ollama-data:
