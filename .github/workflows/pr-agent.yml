name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@v0.34.3
        env:
          # DeepSeek API 配置
          CONFIG.MODEL: "deepseek/deepseek-v4-pro"
          CONFIG.FALLBACK_MODELS: "[deepseek/deepseek-v4-pro]"
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI.API_BASE: "https://api.deepseek.com/v1"

          # GitHub 配置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # PR-Agent 行为配置
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "请用中文进行代码审查"
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: "请用中文生成 PR 描述"
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: "请用中文提供代码改进建议"
