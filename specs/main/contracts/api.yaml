openapi: 3.0.0
info:
  title: Artifact Data Dashboard API
  version: 1.0.0
  description: 用于管理 artifacts、knowledge graph 与 chat 的 API。
servers:
  - url: http://localhost:3000/api
    description: 本地开发（Local Development）
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - total
        - page
        - limit
        - totalPages
    Attachment:
      type: object
      properties:
        id:
          type: integer
        ownerType:
          type: string
          nullable: true
        ownerId:
          type: integer
          nullable: true
        uploadedBy:
          type: integer
        originalName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
        downloadUrl:
          type: string
      required:
        - id
        - uploadedBy
        - originalName
        - mimeType
        - sizeBytes
        - createdAt
        - downloadUrl
    AttachmentsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - data
        - meta

    AiPluginsStatus:
      type: object
      properties:
        configPath:
          type: string
        version:
          type: integer
        defaultProvider:
          type: string
        providers:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
        capabilities:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
        enabled:
          type: boolean
      required:
        - configPath
        - version
        - defaultProvider
        - providers
        - capabilities
        - enabled

    AiPluginsStatusResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AiPluginsStatus'
      required:
        - data
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 用户登录（User login）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功（Login successful）
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /artifacts:
    get:
      summary: 获取 artifacts 列表（List artifacts）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: artifacts 列表（List of artifacts）
    post:
      summary: 创建 artifact（仅 Admin）（Create artifact - Admin only）
      responses:
        '201':
          description: 已创建（Created）
  /graph:
    get:
      summary: 获取 knowledge graph 数据（Get knowledge graph data）
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: 图谱 nodes 与 edges（Graph nodes and edges）
  /chat:
    post:
      summary: 发送 chat 消息（Send message to chat）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                conversationId:
                  type: string
      responses:
        '200':
          description: Chat 响应（Chat response）
  /wordcloud/analyze:
    post:
      summary: 生成词云数据（Generate word cloud data）
      responses:
        '200':
          description: 词云数据（Word cloud data）

  /attachments:
    get:
      summary: 获取附件列表（List attachments）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: ownerType
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentsListResponse'
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attachments/upload:
    post:
      summary: 上传附件（仅 Admin）（Upload attachment - Admin only）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                ownerType:
                  type: string
                ownerId:
                  type: integer
      responses:
        '201':
          description: 上传成功
        '403':
          description: 权限不足（仅管理员可上传）

  /attachments/{id}:
    get:
      summary: 获取附件元数据（Get attachment metadata）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 附件元数据
        '404':
          description: 附件不存在
    delete:
      summary: 删除附件（仅 Admin）（Delete attachment - Admin only）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
        '403':
          description: 权限不足（仅管理员可删除）

  /ai-plugins/status:
    get:
      summary: 获取 AI 插件状态（仅 Admin）（Get AI plugins status - Admin only）
      responses:
        '200':
          description: 当前配置与启用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPluginsStatusResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attachments/{id}/download:
    get:
      summary: 下载附件（Download attachment）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 文件流
