[tool.ruff]
target-version = "py310"  # 项目最低 Python 3.10
line-length = 100
extend-exclude = [".venv", "__pycache__", "*.pyc"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # 行太长由 formatter 处理
    "B008",  # FastAPI Depends() 是标准依赖注入模式，非 bug
    "E741",  # 变量名 l 问题：历史代码大量使用，逐步清理
    "B904",  # raise without from：历史代码模式，不影响功能
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
